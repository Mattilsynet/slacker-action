name: Slack notify

on:
  workflow_dispatch: {}
  push:
    branches:
      - 'main'

jobs:
  std:
    name: Standard message
    runs-on: ubuntu-latest
    steps:
      - env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        uses: Mattilsynet/slacker-action@main
        with:
          channel-id: C08C995BUAZ
          text: 'A simple message without any fuss'
          short-text: 'A simple message...'
          debug: true

  with-args:
    name: Using args
    runs-on: ubuntu-latest
    steps:
      - env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        uses: Mattilsynet/slacker-action@main
        with:
          channel-id: C08C995BUAZ
          args: |
            commit-url=https://github.com/${{ github.repository }}/commit/${{ github.sha }}
            bulb=:bulb:
          text: '[bulb] A more refined message with a link to the latest <[commit-url] | commit> using `args`.'
          short-text: 'A more refined message...'
          debug: true

  update:
    name: Updating a message
    runs-on: ubuntu-latest
    steps:
      - id: slack
        name: Post a message to slack
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        uses: Mattilsynet/slacker-action@main
        with:
          channel-id: C08C995BUAZ
          text: 'Has this message been updated? :x:'
          short-text: 'Message needs updating'
          debug: true
      - name: Wait a bit
        run: sleep 4
      - name: Update the message
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        uses: Mattilsynet/slacker-action@main
        with:
          channel-id: C08C995BUAZ
          message-id: ${{ steps.slack.outputs.message-id }}
          text: 'Has this message been updated? :white_check_mark:'
          short-text: 'Message is updated'
          debug: true

  reply:
    name: Replying to a message
    runs-on: ubuntu-latest
    steps:
      - id: slack
        name: Post a message to slack
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        uses: Mattilsynet/slacker-action@main
        with:
          channel-id: C08C995BUAZ
          text: 'Message that should have a reply'
          short-text: 'Message with reply'
          debug: true
      - name: Wait a bit
        run: sleep 4
      - name: Reply to the message
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        uses: Mattilsynet/slacker-action@main
        with:
          channel-id: C08C995BUAZ
          reply-to-id: ${{ steps.slack.outputs.message-id }}
          text: 'This is a most resplendent comment'
          short-text: 'This is a most...'
          debug: true

  dupe:
    name: Changing the name and icon of the author
    runs-on: ubuntu-latest
    steps:
      - env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        uses: Mattilsynet/slacker-action@main
        with:
          channel-id: C08C995BUAZ
          bot-name: "Gandalf"
          bot-icon: ":gandalf-2:"
          text: '> They have taken the bridge and the second hall. We have barred the gates but cannot hold them for long. The ground shakes, drums... drums in the deep. We cannot get out. A shadow lurks in the dark. We can not get out... they are coming.'
          short-text: 'They have taken the bridge...'
          debug: true
